<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
    <script>
        function submitForm(event) {
            event.preventDefault();
            const button = document.getElementById('submit-button');
            button.disabled = true; // Disable button after submission

            const formData = new FormData(event.target);
            const timestamp = new Date().toISOString(); // Timestamp recording

            fetch('https://script.google.com/macros/s/AKfycbySWftGSOK8YDfatoTI98enPuz-cPd1igj464k9K9hfVYc7fNC3KxNtr252Ms6fBVgmEQ/exec', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                alert('Form submitted successfully at ' + timestamp);
            })
            .catch(error => {
                alert('There was a problem with your submission: ' + error.message);
            })
            .finally(() => {
                button.disabled = false; // Re-enable button
            });
        }
    </script>
</head>
<body>
    <form id="myForm" onsubmit="submitForm(event)">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <input type="submit" id="submit-button" value="Submit">
    </form>
</body>
</html>
