<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Phrae City Care - รายงานปัญหาเมืองแพร่</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Kanit', sans-serif; display: flex; height: 100vh; }
        #map { flex: 1; height: 100vh; width: 100%; }
        
        .sidebar {
            width: 380px;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            height: 100vh;
        }

        .header { border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 10px; }
        .header h2 { margin: 0; color: #007bff; font-size: 1.5rem; }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: 600; color: #444; }
        input, select, textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Kanit', sans-serif;
        }

        .btn-submit {
            background: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }
        .btn-submit:hover { background: #218838; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        
        .status-msg { 
            font-size: 0.9rem; 
            padding: 10px;
            border-radius: 5px;
        }
        .status-msg.success { 
            background: #d4edda;
            color: #155724;
        }
        .status-msg.error { 
            background: #f8d7da;
            color: #721c24;
        }
        .coords { font-size: 0.85rem; color: #666; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="header">
            <h2>📍 รายงานปัญหา</h2>
            <p style="font-size: 0.85rem; color: #666;">คลิกบนแผนที่เพื่อเลือกจุดที่พบปัญหา</p>
        </div>

        <div class="form-group">
            <label>📌 พิกัดที่เลือก:</label>
            <div class="coords" id="display-coords">ยังไม่ได้เลือกจุด</div>
        </div>

        <div class="form-group">
            <label>ประเภทปัญหา:</label>
            <select id="problem-type">
                <option value="">-- เลือก --</option>
                <option value="ถนน/ทางเท้า">ถนน/ทางเท้า</option>
                <option value="ขยะ/ความสะอาด">ขยะ/ความสะอาด</option>
                <option value="ไฟฟ้าส่องสว่าง">ไฟฟ้าส่องสว่าง</option>
                <option value="ท่อระบายน้ำ">ท่อระบายน้ำ</option>
                <option value="อื่นๆ">อื่นๆ</option>
            </select>
        </div>

        <div class="form-group">
            <label>รายละเอียด:</label>
            <textarea id="details" rows="4" placeholder="อธิบายปัญหาที่พบ..."></textarea>
        </div>

        <button class="btn-submit" id="submit-btn" onclick="submitData()">บันทึก</button>
        <p id="status" class="status-msg"></p>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([18.1445, 100.1415], 14);
        L.tileLayer('https://{s}.tile.osm.org/{z}/{x}/{y}.png', { attribution: 'OSM' }).addTo(map);

        let tempMarker = null;
        let selectedLatLng = null;

        map.on('click', function(e) {
            selectedLatLng = e.latlng;
            if (tempMarker) map.removeLayer(tempMarker);
            tempMarker = L.marker(selectedLatLng).addTo(map);
            document.getElementById('display-coords').innerText = 
                `Lat: ${selectedLatLng.lat.toFixed(5)}, Lng: ${selectedLatLng.lng.toFixed(5)}`;
        });

        function submitData() {
            if (!selectedLatLng) {
                alert("กรุณาคลิกเลือกจุด");
                return;
            }

            const formData = new FormData();
            formData.append('lat', selectedLatLng.lat);
            formData.append('lng', selectedLatLng.lng);
            formData.append('type', document.getElementById('problem-type').value);
            formData.append('details', document.getElementById('details').value);

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;

            fetch('https://script.google.com/macros/s/AKfycby_fNw135SFPcUE2XTye8wY_n6HmcTXGboTzJhOfYOJt9pt2U8kfvXGc_n8unu4OP02/exec', {
                method: 'POST',
                body: formData
            })
            .then(() => {
                document.getElementById('status').innerText = "✅ สำเร็จ!";
                document.getElementById('status').className = 'status-msg success';
                document.getElementById('details').value = "";
                setTimeout(() => { btn.disabled = false; }, 2000);
            })
            .catch(error => {
                document.getElementById('status').innerText = "❌ ข้อผิดพลาด";
                document.getElementById('status').className = 'status-msg error';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
